services:
  db:
    image: postgres:16-alpine
    container_name: huellitas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: huellitas
    ports:
      - "5432:5432"
    volumes:
      - huellitas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d huellitas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  huellitas_pgdata:
